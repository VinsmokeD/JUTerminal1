name: cybersim

# ═══════════════════════════════════════════════════════════════════
#  CyberSim — Single-Node Docker Compose
#  Scenarios: SC-01 (Web App), SC-02 (Active Directory), SC-03 (Phishing)
#  Bring up core: docker-compose up -d
#  Bring up a scenario: docker-compose --profile sc01 up -d
# ═══════════════════════════════════════════════════════════════════

# Shared label applied to every CyberSim container.
# The docker-safe.ps1 wrapper reads this label before allowing removal.
x-cybersim-defaults: &cybersim-defaults
  labels:
    com.cybersim.protect: "true"
    com.cybersim.project: "JUTerminal1"

services:

  # ── Core Infrastructure ───────────────────────────────────────────
  postgres:
    <<: *cybersim-defaults
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersim}
      POSTGRES_DB: ${POSTGRES_DB:-cybersim}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersim"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    <<: *cybersim-defaults
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  elasticsearch:
    <<: *cybersim-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  # ── SIEM Pipeline ─────────────────────────────────────────────────
  filebeat:
    <<: *cybersim-defaults
    image: docker.elastic.co/beats/filebeat:8.13.2
    user: root
    # --strict.perms=false required on Windows Docker Desktop:
    # bind-mounted files always appear as -rwxrwxrwx, which filebeat rejects.
    command: filebeat -e --strict.perms=false
    environment:
      - setup.kibana.host=kibana:5601
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/docker/siem/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - sc01_waf_logs:/waf-logs:ro
      - sc02_samba_logs:/samba-logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256m

  # ── Application ───────────────────────────────────────────────────
  backend:
    <<: *cybersim-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      - OPENROUTER_MAX_TOKENS=${OPENROUTER_MAX_TOKENS:-500}
      - AI_CALL_COOLDOWN_SECONDS=${AI_CALL_COOLDOWN_SECONDS:-10}
      - POSTGRES_URL=postgresql+asyncpg://${POSTGRES_USER:-cybersim}:${POSTGRES_PASSWORD:-cybersim}@postgres:5432/${POSTGRES_DB:-cybersim}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      - DOCKER_SOCKET=/var/run/docker.sock
      - KALI_IMAGE=${KALI_IMAGE:-cybersim-kali:latest}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-10}
      - CONTAINER_CPU_LIMIT=${CONTAINER_CPU_LIMIT:-1.0}
      - CONTAINER_MEMORY_LIMIT=${CONTAINER_MEMORY_LIMIT:-512m}
    group_add:
      - "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./:/project:ro
      - ./backend/src:/app/src
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/migrations:/app/migrations:ro
      - ./ai-monitor:/app/ai-monitor:ro
      - ./docs/scenarios:/app/scenarios:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Pure-Python probe (no curl/wget dependency in the image). start_period
      # covers the lifespan boot (db init, admin seed, redis, SIEM, daemons).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512m

  frontend:
    <<: *cybersim-defaults
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${ENVIRONMENT:-development}
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL:-}
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_WS_URL=${VITE_WS_URL:-}
    ports:
      - "3000:80"
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  nginx:
    <<: *cybersim-defaults
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ── SC-01: NovaMed Web App Pentest ────────────────────────────────
  # Start with: docker-compose --profile sc01 up -d
  sc01-db:
    image: mariadb:11
    hostname: sc01-db
    env_file:
      - ./infrastructure/docker/scenarios/sc01/db.env
    environment:
      MARIADB_ROOT_PASSWORD: NovaMedRoot2024!
      MARIADB_DATABASE: novamed
      MARIADB_USER: webapp
      MARIADB_PASSWORD: WebAppPass2024!
    volumes:
      - ./infrastructure/docker/scenarios/sc01/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Phase-B hardening: no-new-privileges is safe — MariaDB uses gosu (CAP_SETUID
    # syscall, not setuid-exec) to drop from root to mysql. cap_drop omitted: DB
    # init needs CHOWN/SETUID/SETGID/DAC_OVERRIDE; removing them without full
    # end-to-end DB-init testing risks a silent broken scenario (R3 partial).
    security_opt:
      - "no-new-privileges:true"
    networks:
      sc01-net:
        ipv4_address: 172.20.1.21
    profiles: ["sc01"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pNovaMedRoot2024!"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  sc01-php:
    build:
      context: ./infrastructure/docker/scenarios/sc01
      dockerfile: Dockerfile.webapp
    hostname: sc01-php
    environment:
      DB_HOST: sc01-db
      DB_USER: webapp
      DB_PASS: WebAppPass2024!
      DB_NAME: novamed
    depends_on:
      sc01-db:
        condition: service_healthy
    networks:
      sc01-net:
        ipv4_address: 172.20.1.22
    profiles: ["sc01"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  sc01-webapp:
    build:
      context: ./infrastructure/docker/scenarios/sc01
      dockerfile: Dockerfile.apache-vuln
    depends_on:
      - sc01-php
    # Phase-B hardening: pure Apache reverse-proxy; no setuid-exec programs.
    # Apache drops root→daemon via setuid() syscall (safe under no-new-privileges).
    # Remaining caps: NET_BIND_SERVICE (port 80), SETUID/SETGID (privilege drop),
    # KILL (master→worker SIGQUIT/SIGTERM across UIDs without uid match).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - KILL
    networks:
      sc01-net:
        ipv4_address: 172.20.1.20
    profiles: ["sc01"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  sc01-waf:
    image: owasp/modsecurity-crs:nginx
    user: root
    entrypoint: ["/bin/sh", "/waf-entrypoint.sh"]
    environment:
      BACKEND: http://172.20.1.20:80
      SERVER_NAME: novamed.local
      MODSEC_AUDIT_ENGINE: "On"
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_AUDIT_LOG: /var/log/modsec/audit.log
      PARANOIA: "2"
    volumes:
      - ./infrastructure/docker/scenarios/sc01/waf-entrypoint.sh:/waf-entrypoint.sh:ro
      - ./infrastructure/docker/scenarios/sc01/waf-nginx.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - sc01_waf_logs:/var/log/modsec
    # Phase-B hardening: nginx WAF; entrypoint does chown -R nginx:nginx on log dirs
    # (CHOWN), nginx drops root→worker via setuid() syscall (SETUID/SETGID), master
    # signals workers across UIDs (KILL), and the image's own /90-copy-modsecurity-
    # config.sh writes to root-owned files in the overlay layer (DAC_OVERRIDE).
    # Drops: AUDIT_WRITE, FOWNER, FSETID, MKNOD, NET_RAW, SETFCAP, SETPCAP,
    # SYS_CHROOT — 14 default caps → 7.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    depends_on:
      sc01-webapp:
        condition: service_started
    networks:
      sc01-net:
        ipv4_address: 172.20.1.1
    profiles: ["sc01"]
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/nginx -t >/dev/null 2>&1 && /usr/bin/bash -c '</dev/tcp/127.0.0.1/80'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m

  # ── SC-02: Nexora Active Directory Compromise ─────────────────────
  # Start with: docker-compose --profile sc02 up -d
  sc02-dc:
    build:
      context: ./infrastructure/docker/scenarios/sc02
      dockerfile: Dockerfile.dc
    # WS7 hardening note (R3 — fail-open, documented):
    # Samba AD DC requires SYS_PTRACE (winbindd↔smbd IPC), NET_BIND_SERVICE
    # (port 88/389/445/636), SETUID/SETGID/CHOWN (Samba internal privilege drops),
    # SYS_ADMIN (mount for SYSVOL), and DAC_OVERRIDE. Specifying no-new-privileges
    # conflicts with Samba's internal capability management and breaks kerberos.
    # Left without security_opt/cap_drop until Samba-in-container privilege model
    # is fully mapped. See docs/SECURITY_THREAT_MODEL.md R3.
    environment:
      - DOMAIN=nexora.local
      - REALM=NEXORA.LOCAL
      - NETBIOS_NAME=NEXORA
      - ADMINPASS=${SC02_ADMIN_PASS:-NexoraAdmin2024!}
    networks:
      sc02-net:
        ipv4_address: 172.20.2.20
    # Named volumes live on the Docker VM's ext4 filesystem, which supports
    # the security.NTACL xattr that the overlay2 merged layer rejects with
    # NT_STATUS_ACCESS_DENIED on Docker Desktop / WSL2.
    volumes:
      - sc02_samba_lib:/var/lib/samba
      - sc02_samba_cache:/var/cache/samba
      - sc02_samba_logs:/var/log/samba
    profiles: ["sc02"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "smbclient", "-L", "127.0.0.1", "-N"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  sc02-fileserver:
    build:
      context: ./infrastructure/docker/scenarios/sc02
      dockerfile: Dockerfile.fileserver
    # WS7 hardening note (R3 — fail-open, documented):
    # Samba member server requires NET_BIND_SERVICE (445), SETUID/SETGID/CHOWN
    # for Samba's winbind/smbd privilege model, and DAC_OVERRIDE for SYSVOL
    # NTACL traversal. Left without security_opt/cap_drop for same reasons as
    # sc02-dc. See docs/SECURITY_THREAT_MODEL.md R3.
    environment:
      - DC_IP=172.20.2.20
      - DOMAIN=nexora.local
      - REALM=NEXORA.LOCAL
      - NETBIOS_NAME=NEXORA
      - ADMINPASS=${SC02_ADMIN_PASS:-NexoraAdmin2024!}
    depends_on:
      sc02-dc:
        condition: service_healthy
    networks:
      sc02-net:
        ipv4_address: 172.20.2.40
    profiles: ["sc02"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "smbclient", "-L", "127.0.0.1", "-N"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  # ── SC-03: Orion Logistics Phishing Campaign ──────────────────────
  # Start with: docker-compose --profile sc03 up -d
  sc03-mailrelay:
    build:
      context: ./infrastructure/docker/scenarios/sc03
      dockerfile: Dockerfile.mailrelay
    # WS7 hardening: Postfix uses master(8) to launch workers as postfix/mail users,
    # so it needs SETUID/SETGID/CHOWN for privilege drop. NET_BIND_SERVICE for port 25.
    # no-new-privileges is safe because master already holds required caps before exec.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
    networks:
      sc03-net:
        ipv4_address: 172.20.3.20
    profiles: ["sc03"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-zv", "127.0.0.1", "25"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  sc03-phish:
    build:
      context: ./infrastructure/docker/scenarios/sc03
      dockerfile: Dockerfile.gophish
    environment:
      - GOPHISH_ADMIN_PORT=3333
      - GOPHISH_PHISH_PORT=80
      - GOPHISH_PHISH_SSL_PORT=443
    # Phase-B hardening: GoPhish runs as non-root 'app' user (set in base image).
    # Pure Go binary — no setuid programs, no privilege-drop exec. Only needs
    # NET_BIND_SERVICE for the phishing port 80 (admin :3333 is above 1024).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      sc03-net:
        ipv4_address: 172.20.3.10
    depends_on:
      sc03-mailrelay:
        condition: service_healthy
    profiles: ["sc03"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pidof gophish > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  sc03-victim:
    build:
      context: ./infrastructure/docker/scenarios/sc03
      dockerfile: Dockerfile.victim
    # WS7 hardening: victim-simulator is a pure Python HTTP server on port 8080
    # (>1024) — no setuid binaries, no privilege-drop exec, no raw sockets.
    # Full cap_drop ALL is safe; no cap_add required.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      sc03-net:
        ipv4_address: 172.20.3.30
    depends_on:
      sc03-mailrelay:
        condition: service_healthy
    profiles: ["sc03"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

# ─────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  elastic_data:
  sc01_waf_logs:
  sc02_samba_lib:
  sc02_samba_cache:
  sc02_samba_logs:

networks:
  # Shared internal network for all core services
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.254

  # Isolated scenario networks (internal: true = no internet access)
  sc01-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.1.0/24
          gateway: 172.20.1.254

  sc02-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.2.0/24
          gateway: 172.20.2.254

  sc03-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.3.0/24
          gateway: 172.20.3.254
