<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NEXORA Secure Sign-In</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; color: #202735; }
    main { width: 360px; margin: 9vh auto; background: #fff; border: 1px solid #dfe4ee; border-radius: 6px; padding: 28px; box-shadow: 0 18px 48px rgba(30, 41, 59, .12); }
    .brand { font-size: 22px; font-weight: 700; color: #174ea6; margin-bottom: 18px; }
    label { display: block; font-size: 12px; color: #667085; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfd7e6; border-radius: 4px; margin-top: 5px; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 4px; background: #174ea6; color: #fff; font-weight: 700; }
    .fine { margin-top: 16px; font-size: 11px; color: #98a2b3; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand">NEXORA SSO</div>
    <p>Session expired. Re-authenticate to continue to Finance Portal.</p>
    <label>Email</label>
    <input name="email" placeholder="name@nexora.local">
    <label>Password</label>
    <input name="password" type="password">
    <label>One-time code</label>
    <input name="otp" placeholder="000000">
    <button>Verify identity</button>
    <div class="fine">Training landing page. Captures are simulated by GoPhish events.</div>
  </main>
</body>
</html>
