[global]
   workgroup = NEXORA
   realm = NEXORA.LOCAL
   netbios name = NEXORA-FS01
   security = ADS

   bind interfaces only = yes
   interfaces = lo eth0
   acl_xattr:ignore system acls = yes

   server string = NEXORA-FS01 - Nexora Financial File Services (Samba 4.15.13)
   log file = /var/log/samba/log.%m
   max log size = 50000
   log level = 5 auth:5 kerberos:5

   kerberos method = secrets and keytab
   dedicated keytab file = /etc/krb5.keytab

   idmap config * : backend = tdb
   idmap config * : range = 3000-7999
   idmap config NEXORA : backend = ad
   idmap config NEXORA : range = 10000-99999
   winbind use default domain = yes
   winbind offline logon = false

   client max protocol = SMB3
   server max protocol = SMB3
   min protocol = SMB2

   vfs objects = full_audit
   full_audit:priority = notice
   full_audit:facility = LOCAL1
   full_audit:success = mkdir rmdir rmfile unlink rename open opendir read write close disconnect
   full_audit:failure = open read write
   full_audit:prefix = %u|%I|%m|%S
   # SIEM parser maps auth/file events to Windows-style IDs:
   # 4624 success, 4625 failure, 4768 TGT, 4769 TGS, 4670 file access.

[Public]
   path = /srv/shares/public
   read only = no
   guest ok = yes
   comment = Public documents - no authentication required
   browseable = yes
   writable = yes
   force create mode = 0644
   force directory mode = 0755

[Finance]
   path = /srv/shares/finance
   read only = no
   valid users = @"NEXORA\Domain Users", NEXORA\jsmith
   comment = Finance department files - restricted access
   browseable = yes
   writable = yes
   force create mode = 0640
   force directory mode = 0750
   create mask = 0640
   directory mask = 0750

[Backups]
   path = /srv/shares/backups
   read only = no
   valid users = @"NEXORA\Domain Admins", NEXORA\svc_backup
   comment = Backup storage - restricted to admins and backup service
   browseable = no
   writable = yes
   create mask = 0600
   directory mask = 0700

[Admin]
   path = /srv/shares/admin
   read only = yes
   valid users = NEXORA\it.admin, @"NEXORA\Domain Admins"
   comment = IT administration logs - read-only
   browseable = no

[HR$]
   path = /srv/shares/hr
   read only = yes
   valid users = @"NEXORA\Domain Users"
   comment = HR onboarding documents
   browseable = no

[IT$]
   path = /srv/shares/it
   read only = yes
   valid users = @"NEXORA\Domain Users", NEXORA\jsmith
   comment = IT automation scripts
   browseable = no
