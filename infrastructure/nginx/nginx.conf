worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Use Docker's built-in DNS resolver to prevent caching old IPs
    # when containers are restarted.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # ── Security headers (applied to all responses incl. errors) ──────────
        # Clickjacking, MIME-sniffing, referrer, and feature-policy protection.
        # NOTE: a Content-Security-Policy is intentionally omitted here pending
        # browser validation against the Vite SPA + xterm.js + WebSocket origins.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Health check (bypass auth)
        location = /health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
        }

        # API — forward to FastAPI
        location /api/ {
            set $backend_api http://backend:8000;
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WebSocket — forward to FastAPI with upgrade headers
        location /ws/ {
            set $backend_ws http://backend:8000;
            proxy_pass $backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else — React SPA
        location / {
            set $frontend_app http://frontend:80;
            proxy_pass $frontend_app;
            proxy_set_header Host $host;
        }
    }
}
