worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Use Docker's built-in DNS resolver to prevent caching old IPs
    # when containers are restarted.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # ── Security headers (applied to all responses incl. errors) ──────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Content-Security-Policy — Report-Only mode until browser-validated.
        # Policy allows:
        #   default-src: same origin only (strict default)
        #   script-src:  same origin + Vite module preloads (no unsafe-eval except
        #                for the xterm WebGL worker, see note below)
        #   style-src:   same origin + 'unsafe-inline' (xterm.js injects styles)
        #   connect-src: same origin + ws/wss (WebSocket terminal/SIEM)
        #   img-src:     same origin + data: (canvas toDataURL, favicon)
        #   font-src:    same origin (no CDN fonts used)
        #   frame-ancestors: 'none' (same as X-Frame-Options SAMEORIGIN, belt+braces)
        #   object-src:  'none' (block plugins)
        # NOTE: xterm-addon-webgl uses OffscreenCanvas workers which may need
        # 'unsafe-eval'; leave in Report-Only until verified in a browser.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; object-src 'none';" always;

        # Health check (bypass auth)
        location = /health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
        }

        # API — forward to FastAPI
        location /api/ {
            set $backend_api http://backend:8000;
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WebSocket — forward to FastAPI with upgrade headers
        location /ws/ {
            set $backend_ws http://backend:8000;
            proxy_pass $backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else — React SPA
        location / {
            set $frontend_app http://frontend:80;
            proxy_pass $frontend_app;
            proxy_set_header Host $host;
        }
    }
}
