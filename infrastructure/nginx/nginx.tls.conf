worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# OPT-IN TLS CONFIG (not used by the default stack).
# Enable with:  docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# Requires certs in ./infrastructure/nginx/certs/ — generate with
#   scripts/generate-tls-cert.ps1   (or the openssl one-liner in TLS-README.md)
# ─────────────────────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Docker's built-in DNS resolver (avoids caching stale container IPs).
    resolver 127.0.0.11 valid=10s;

    # ── Redirect all plaintext HTTP to HTTPS ──────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── TLS server ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/parallax.crt;
        ssl_certificate_key /etc/nginx/certs/parallax.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ── Security headers ──────────────────────────────────────────────────
        # HSTS: only meaningful over TLS, so it lives here (not in the HTTP config).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; font-src 'self'; frame-ancestors 'none'; object-src 'none';" always;

        # Health check (bypass auth)
        location = /health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health/health;
        }

        # API — forward to FastAPI
        location /api/ {
            set $backend_api http://backend:8000;
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        # WebSocket — forward to FastAPI with upgrade headers (wss:// terminates here)
        location /ws/ {
            set $backend_ws http://backend:8000;
            proxy_pass $backend_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else — React SPA
        location / {
            set $frontend_app http://frontend:80;
            proxy_pass $frontend_app;
            proxy_set_header Host $host;
        }
    }
}
