[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py", "unit_test_*.py", "integration_test.py"]
markers = [
    "e2e: opt-in Docker/Kali scenario acceptance tests",
]

[tool.coverage.run]
omit = [
    "src/main.py",
    "src/ai/*",
    "src/auth/routes.py",
    "src/cache/redis.py",
    "src/instructor/*",
    "src/reports/generator.py",
    "src/reports/learning_insights.py",
    "src/sandbox/container_cleanup.py",
    "src/sandbox/daemon_noise.py",
    "src/sandbox/manager.py",
    "src/sandbox/terminal.py",
    "src/scenarios/branching.py",
    "src/scenarios/engine.py",
    "src/scenarios/gatekeeper.py",
    "src/scenarios/hint_engine.py",
    "src/scenarios/routes.py",
    "src/sessions/routes.py",
    "src/siem/engine.py",
    "src/ws/routes.py",
]
