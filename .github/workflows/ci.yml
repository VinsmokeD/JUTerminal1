name: CI

# Gating philosophy:
#   GATE     jobs must pass to merge: backend-test, frontend (build), compose-validate, docker-build.
#   ADVISORY jobs report but never block (continue-on-error): formatting, types, lint, audits.
#   Style/audit debt is tracked separately; it must not hide real regressions.

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── GATE: the real test suite against ephemeral Postgres + Redis ───────────
  backend-test:
    name: Backend — tests (GATE)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cybersim
          POSTGRES_PASSWORD: cybersim
          POSTGRES_DB: cybersim_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    defaults:
      run:
        working-directory: backend
    env:
      # conftest.py reads TEST_POSTGRES_URL / TEST_REDIS_URL and these WIN over
      # POSTGRES_URL/REDIS_URL — set the ones the harness actually honors, and
      # point at the dedicated cybersim_test database for hermetic runs.
      TEST_POSTGRES_URL: postgresql+asyncpg://cybersim:cybersim@localhost:5432/cybersim_test
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret-not-for-production
      ENVIRONMENT: test
      # Empty key => deterministic static-fallback hints; CI makes no live LLM calls.
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # requirements.txt already pins pytest/pytest-asyncio/httpx/httpx-ws.
      # Do NOT also `pip install pytest pytest-asyncio` — that re-resolves the
      # pins and re-introduces the pytest<8.4 / pytest-asyncio>=8.4 conflict.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit + integration tests (e2e excluded)
        run: pytest --ignore=tests/e2e -p no:cacheprovider -q

  # ── Backend formatting (GATE) + types (advisory) ───────────────────────────
  backend-quality:
    name: Backend — format (GATE) & types (advisory)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # GATE: the tree is black-clean as of 2026-05-29; keep it that way.
      # Run `black src/ tests/` locally to fix.
      # GATE: tree is black-clean as of 2026-05-29; keep it that way.
      - name: Black (GATE)
        run: black --check src/ tests/
      # GATE: tree is mypy-clean as of 2026-05-30 (54→0 errors); keep it that way.
      # Run `mypy src/ --ignore-missing-imports` locally to check before committing.
      - name: mypy (GATE)
        run: mypy src/ --ignore-missing-imports

  # ── GATE: frontend production build + lint ─────────────────────────────────
  frontend:
    name: Frontend — ESLint (GATE) & build (GATE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # GATE: tree is ESLint-clean as of 2026-05-30; keep it that way.
      # Run `npm run lint` locally to check; fix errors before committing.
      - name: ESLint (GATE)
        run: npm run lint
      - name: Unit tests (GATE)
        run: npm test
      - name: Build (GATE)
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_WS_URL: /ws

  # ── GATE: compose config is valid (catches YAML/interpolation errors) ──────
  compose-validate:
    name: Compose — config valid (GATE)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-validate-only
    steps:
      - uses: actions/checkout@v4
      - name: Validate core docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  # ── GATE: images actually build (catches dependency/pin conflicts) ─────────
  docker-build:
    name: Docker — build images (GATE)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cybersim-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t cybersim-frontend:ci ./frontend
        # Frontend Dockerfile provides ARG defaults for VITE_* values.

  # ── ADVISORY: network isolation verification (reports, never blocks) ────────
  network-isolation:
    name: Network — scenario isolation (advisory)
    runs-on: ubuntu-latest
    needs: [compose-validate]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify scenario container isolation
        run: |
          chmod +x scripts/verify-network-isolation.sh
          bash scripts/verify-network-isolation.sh || echo "::warning::Isolation check failed — review docker network config"

  # ── ADVISORY: dependency + secret scanning (reports, never blocks) ─────────
  security-scan:
    name: Security — deps & secrets (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip-audit (Python deps)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Secret scan (gitleaks)
        continue-on-error: true
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact -v
