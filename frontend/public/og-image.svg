<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
    <path d="M 46 0 L 0 0 0 46" fill="none" stroke="rgba(120,150,200,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Red ambient glow -->
  <ellipse cx="320" cy="240" rx="380" ry="280" fill="#FF6B7A" opacity="0.07"/>
  <!-- Blue ambient glow -->
  <ellipse cx="880" cy="390" rx="380" ry="280" fill="#4CC2FF" opacity="0.07"/>

  <!-- Logo mark — centered left block -->
  <!-- Red square glow -->
  <rect x="148" y="168" width="156" height="156" fill="#FF6B7A" opacity="0.25" filter="url(#redGlow)"/>
  <!-- Blue square glow -->
  <rect x="244" y="264" width="156" height="156" fill="#4CC2FF" opacity="0.25" filter="url(#blueGlow)"/>
  <!-- Red square solid -->
  <rect x="148" y="168" width="156" height="156" fill="#FF6B7A" opacity="0.95"/>
  <!-- Blue square solid -->
  <rect x="244" y="264" width="156" height="156" fill="#4CC2FF" opacity="0.95"/>
  <!-- Overlap violet -->
  <rect x="244" y="264" width="60" height="60" fill="#9B7DFF"/>

  <!-- Wordmark -->
  <text x="460" y="295"
    font-family="'Orbitron', 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="96"
    letter-spacing="12"
    fill="#F0F4FF">PARALLAX</text>

  <!-- Tagline -->
  <text x="462" y="358"
    font-family="'JetBrains Mono', 'Consolas', monospace"
    font-weight="400"
    font-size="22"
    letter-spacing="4"
    fill="#6E849F">DUAL-PERSPECTIVE CYBERSECURITY TRAINING</text>

  <!-- Divider -->
  <line x1="460" y1="390" x2="1100" y2="390" stroke="rgba(140,165,210,0.15)" stroke-width="1"/>

  <!-- Red Team pill -->
  <rect x="462" y="414" width="140" height="36" rx="6" fill="rgba(255,107,122,0.12)" stroke="rgba(255,107,122,0.35)" stroke-width="1"/>
  <text x="532" y="437" text-anchor="middle"
    font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700"
    letter-spacing="2" fill="#FF6B7A">RED TEAM</text>

  <!-- Blue Team pill -->
  <rect x="618" y="414" width="150" height="36" rx="6" fill="rgba(76,194,255,0.10)" stroke="rgba(76,194,255,0.30)" stroke-width="1"/>
  <text x="693" y="437" text-anchor="middle"
    font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700"
    letter-spacing="2" fill="#4CC2FF">BLUE TEAM</text>

  <!-- AI pill -->
  <rect x="784" y="414" width="120" height="36" rx="6" fill="rgba(155,125,255,0.10)" stroke="rgba(155,125,255,0.30)" stroke-width="1"/>
  <text x="844" y="437" text-anchor="middle"
    font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700"
    letter-spacing="2" fill="#9B7DFF">AI TUTOR</text>

  <!-- University footer -->
  <text x="462" y="548"
    font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="2"
    fill="rgba(160,185,220,0.45)">UNIVERSITY OF JORDAN — KASIT — 2026</text>

  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" rx="8"
    fill="none" stroke="rgba(140,165,210,0.10)" stroke-width="1.5"/>
</svg>
