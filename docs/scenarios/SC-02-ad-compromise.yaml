id: SC-02
title: "Nexora Financial - Active Directory Compromise"
display_name: "Nexora Financial — Active Directory Compromise"
network:
  cidr: 172.20.2.0/24
  hosts:
    - { name: NEXORA-DC01, fqdn: nexora-dc01.nexora.local, ip: 172.20.2.20, role: dc }
    - { name: NEXORA-FS01, fqdn: nexora-fs01.nexora.local, ip: 172.20.2.40, role: file }
domain:
  fqdn: nexora.local
  realm: NEXORA.LOCAL
  netbios: NEXORA
credentials_initial:
  user: jsmith
  password: Password123
  note: "Low-priv domain user — phished email attachment"
objectives:
  red: ["enumerate", "kerberoast svc_backup", "crack hash", "dcsync as Domain Admin"]
  blue: ["detect 4769 RC4", "detect DCSync 4662", "triage lateral movement"]
tools_expected: [nmap, smbclient, crackmapexec, GetUserSPNs.py, hashcat, secretsdump.py, bloodhound-python, kerbrute]
flags:
  - id: kerberoast_hash
    value_pattern: "svc_backup.*\\$23\\$"
  - id: dcsync_krbtgt_nthash
    value_pattern: "krbtgt:502:[a-f0-9]{32}"

methodologies:
  branch_kerberoast:
    label: "SPN Kerberoasting"
    required_tools: ["bloodhound", "GetUserSPNs.py", "hashcat"]
    evidence_chain: ["SPN discovery", "RC4 service ticket", "service account credential use"]
  branch_asrep:
    label: "AS-REP roastable user"
    required_tools: ["GetNPUsers"]
    evidence_chain: ["rgreen no-preauth marker", "AS-REP hash evidence", "pre-auth remediation"]
  branch_gpp:
    label: "SYSVOL GPP credential"
    required_tools: ["smbclient", "gpp-decrypt"]
    evidence_chain: ["Groups.xml path", "cpassword marker", "credential rotation recommendation"]

methodology_gates:
  impacket-getuserspns:
    min_phase: 2
    block_message: "Map the domain and document service accounts (Phase 1) before requesting TGS tickets."
  hashcat:
    min_phase: 2
    block_message: "You need to extract a Kerberoastable hash before you can crack it."
  crackmapexec:
    min_phase: 3
    block_message: "Perform Recon (Phase 1) and Kerberoasting (Phase 2) to acquire credentials before password spraying."
  impacket-secretsdump:
    min_phase: 4
    block_message: "DCSync requires Domain Admin level privileges. You must complete Lateral Movement (Phase 3) first."

phases:
  1:
    name: "Domain Reconnaissance"
    ptes_phase: "Intelligence Gathering"
    mitre: ["T1087", "T1069", "T1482"]
    objectives:
      - "Enumerate all domain users and groups"
      - "Identify Kerberoastable service accounts"
      - "Map computer accounts and roles"
      - "Find unconstrained delegation objects"
    completion_signals:
      tools_used: ["bloodhound", "ldapsearch", "crackmapexec", "GetUserSPNs.py"]
      min_notes_tagged: { "#finding": 2 }

  2:
    name: "Kerberoasting"
    ptes_phase: "Exploitation"
    mitre: ["T1558.003"]
    objectives:
      - "Request TGS for svc_backup SPN"
      - "Extract RC4-HMAC hash"
      - "Crack hash offline to obtain plaintext"
    completion_signals:
      flags_captured: ["kerberoast_hash"]
      tools_used: ["GetUserSPNs.py", "hashcat"]

  3:
    name: "Lateral Movement"
    ptes_phase: "Post-Exploitation"
    mitre: ["T1550.002", "T1021.002"]
    objectives:
      - "Verify svc_backup access to FS01"
      - "Spray credentials across subnet"
      - "Identify local admin access paths"
    completion_signals:
      tools_used: ["crackmapexec", "smbclient"]
      min_notes_tagged: { "#finding": 3 }

  4:
    name: "Privilege Escalation to Domain Admin"
    ptes_phase: "Post-Exploitation"
    mitre: ["T1003.006", "T1558.001"]
    objectives:
      - "Exploit unconstrained delegation on FS01"
      - "Extract Domain Admin TGT from memory"
      - "Execute DCSync to dump NTDS.dit"
    completion_signals:
      flags_captured: ["dcsync_krbtgt_nthash"]

  5:
    name: "Reporting"
    ptes_phase: "Reporting"
    objectives:
      - "Document full lateral movement path"
      - "Map attack path in BloodHound"
      - "Generate AD compromise report"
    completion_signals:
      report_generated: true

soc_detection:
  - trigger_regex: "GetUserSPNs|kerberoast|TGS"
    severity: high
    event_template: "EventID 4769 — Kerberos TGS Request (RC4) for {target_user} from {source_ip}. Possible Kerberoasting."
    mitre: "T1558.003"
    detection_window_seconds: 60
    source: attacker
  - trigger_regex: "GetNPUsers|AS-REP|KRB5ASREP|DONT_REQ_PREAUTH"
    severity: high
    event_template: "EventID 4768 — AS-REQ without pre-authentication for {target_user} from {source_ip}. AS-REP roastable account exposed."
    mitre: "T1558.004"
    detection_window_seconds: 60
    source: attacker
  - trigger_regex: "Groups\\.xml|cpassword|gpp-decrypt|SYSVOL"
    severity: medium
    event_template: "EventID 4670 — SYSVOL policy credential artifact accessed by {target_user} from {source_ip}."
    mitre: "T1552.006"
    detection_window_seconds: 120
    source: attacker
  - trigger_regex: "crackmapexec|cme .*smb"
    severity: medium
    event_template: "EventID 4625 — Multiple failed logon attempts from {source_ip} across subnet. Credential spray pattern."
    mitre: "T1110.003"
    detection_window_seconds: 120
    source: attacker
  - trigger_regex: "secretsdump|dcsync|drsuapi"
    severity: critical
    event_template: "CRITICAL — EventID 4662 — Replication request from non-DC host {source_ip}. DCSync attack detected."
    mitre: "T1003.006"
    detection_window_seconds: 30
    source: attacker
  - trigger_regex: "smbclient|impacket.*smb|psexec"
    severity: medium
    event_template: "EventID 4624 Type 3 — Network logon as {target_user} from {source_ip} to {target_host}"
    mitre: "T1021.002"
    detection_window_seconds: 60
    source: attacker

scoring:
  red:
    base: 100
    flag_bonuses:
      kerberoast_hash: 30
      dcsync_krbtgt_nthash: 40
    time_bonus_threshold_minutes: 150
    time_bonus_points: 15
  blue:
    base: 100
    detection_bonuses:
      - condition: "kerberoast_detected_within_2min"
        points: 20
      - condition: "4769_rc4_alert_triaged_correctly"
        points: 20
      - condition: "dcsync_blocked_before_completion"
        points: 30
      - condition: "lateral_movement_timeline_documented"
        points: 15
